spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskflow}
    username: ${DB_USER:taskflow_user}
    password: ${DB_PASSWORD:taskflow_pass}
  flyway:
    database: postgresql

jwt:
  secret: ${JWT_SECRET:desarrollo-local-clave-segura-de-al-menos-64-caracteres-aqui}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:86400000}
  refresh-expiration-ms-web: ${JWT_REFRESH_EXPIRATION_MS_WEB:604800000}
  refresh-expiration-ms-mobile: ${JWT_REFRESH_EXPIRATION_MS_MOBILE:2592000000}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1