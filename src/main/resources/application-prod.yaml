# ─────────────────────────────────────────────
# PERFIL: prod
# Se activa con SPRING_PROFILES_ACTIVE=prod
# Todas las variables vienen de AWS Secrets Manager
# inyectadas como variables de entorno al pod en EKS
# ─────────────────────────────────────────────

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: false

  flyway:
    enabled: true
    validate-on-migrate: true
    out-of-order: false

# ─────────────────────────────────────────────
# JWT — valores desde Secrets Manager
# ─────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:86400000}
  refresh-expiration-ms-web: ${JWT_REFRESH_EXPIRATION_MS_WEB:604800000}
  refresh-expiration-ms-mobile: ${JWT_REFRESH_EXPIRATION_MS_MOBILE:2592000000}

# ─────────────────────────────────────────────
# AWS
# ─────────────────────────────────────────────
aws:
  region: ${AWS_REGION:us-east-1}
  # En prod NO se usan access key / secret key
  # El rol IAM del pod en EKS provee las credenciales automáticamente
  ses:
    from-email: ${AWS_SES_FROM_EMAIL}
  s3:
    bucket: ${AWS_S3_BUCKET}

# ─────────────────────────────────────────────
# App
# ─────────────────────────────────────────────
app:
  url: ${APP_URL}
  frontend-url: ${APP_URL}

# ─────────────────────────────────────────────
# Servidor
# ─────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

# ─────────────────────────────────────────────
# Logs — JSON estructurado para CloudWatch
# CloudWatch parsea automáticamente JSON
# ─────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.taskflow: DEBUG
    org.flywaydb: INFO
    org.springframework.security: DEBUG
    org.hibernate: WARN
  pattern:
    console: '{"time":"%d{yyyy-MM-dd HH:mm:ss}","level":"%level","logger":"%logger{36}","msg":"%msg"}%n'

# ─────────────────────────────────────────────
# Actuator — health check para Kubernetes
# Kubernetes llama /actuator/health como liveness y readiness probe
# ─────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,readiness,liveness,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    export:
      prometheus:
        enabled: true