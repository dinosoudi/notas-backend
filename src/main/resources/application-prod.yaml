# ─────────────────────────────────────────────
# PERFIL: prod
# Se activa con SPRING_PROFILES_ACTIVE=prod
# Todas las variables vienen de AWS Secrets Manager
# inyectadas como variables de entorno al contenedor en ECS/Fargate
# ─────────────────────────────────────────────

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5   # fórmula HikariCP: (2 vCPUs * 2) + 1
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: false

  flyway:
    enabled: true
    validate-on-migrate: true
    out-of-order: false

# ─────────────────────────────────────────────
# JWT — valores desde Secrets Manager
# ─────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:86400000}
  refresh-expiration-ms-web: ${JWT_REFRESH_EXPIRATION_MS_WEB:604800000}
  refresh-expiration-ms-mobile: ${JWT_REFRESH_EXPIRATION_MS_MOBILE:2592000000}

# ─────────────────────────────────────────────
# AWS
# ─────────────────────────────────────────────
aws:
  region: ${AWS_REGION:us-east-1}
  # En prod NO se usan access key / secret key
  # El rol IAM de la task en ECS provee las credenciales automáticamente
  ses:
    from-email: ${AWS_SES_FROM_EMAIL}

# ─────────────────────────────────────────────
# App
# ─────────────────────────────────────────────
app:
  url: ${APP_URL}
  frontend-url: ${APP_URL}

# ─────────────────────────────────────────────
# Servidor
# ─────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

# ─────────────────────────────────────────────
# Logs — JSON estructurado para CloudWatch
# CloudWatch parsea automáticamente JSON
# ─────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.taskflow: DEBUG
    org.flywaydb: INFO
    org.springframework.security: DEBUG
    org.hibernate: WARN

# ─────────────────────────────────────────────
# Actuator — health check para Kubernetes
# ECS llama /actuator/health como healthcheck del contenedor y del ALB
# ─────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,readiness,liveness,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}