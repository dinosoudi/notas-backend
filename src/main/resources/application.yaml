spring:
  application:
    name: taskflow-backend
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  datasource:
    hikari:
      maximum-pool-size: 10  # default seguro
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
server:
  port: 8080

debug: false
logging:
  level:
    org.flywaydb: DEBUG

# ─── Actuator ─────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always   # en dev muestra detalles completos
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}