apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskflow-backend-ingress
  namespace: default
  annotations:
    # AWS Load Balancer Controller — crea un ALB automáticamente
    spec.ingressClassName: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

    # HTTPS — el ALB termina SSL y habla HTTP con los pods
    #alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    #alb.ingress.kubernetes.io/certificate-arn: ${ACM_CERTIFICATE_ARN}

    # Health check del ALB — usa el endpoint de Actuator
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"

spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: taskflow-backend-svc
                port:
                  number: 80